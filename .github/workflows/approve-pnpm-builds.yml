name: Approve pnpm build scripts

on:
  push:
    branches: [main, update-packages]
  pull_request:
    branches: [main]

jobs:
  approve-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Activate pnpm 11 via Corepack
        run: corepack prepare pnpm@11 --activate

      - name: Approve pnpm build scripts (non-interactive)
        run: pnpm approve-builds --all || true

      - name: Commit approvals if present
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: approve pnpm build scripts"
            git push
          else
            echo "No approvals generated"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
