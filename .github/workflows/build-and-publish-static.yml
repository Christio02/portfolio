name: Build and publish static output (no Cloudflare token)

on:
  push:
    branches: [main, update-packages]
  pull_request:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Volta
        run: curl https://get.volta.sh | bash -s -- -y

      - name: Add Volta to PATH
        run: echo "$HOME/.volta/bin" >> $GITHUB_PATH

      - name: Pin Node and pnpm
        run: |
          volta install node@24
          volta install pnpm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts
        run: pnpm approve-builds --all || true

      - name: Build
        run: pnpm run build

      - name: Commit and push built output to branch 'pages-build'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # create temp worktree for the output branch
          git fetch origin pages-build || true
          git worktree add /tmp/pages-build origin/pages-build || git worktree add /tmp/pages-build --detach
          rm -rf /tmp/pages-build/*
          cp -r dist/* /tmp/pages-build/ || true
          pushd /tmp/pages-build
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            git commit -m "chore(ci): publish built site from $GITHUB_REF"
            git push origin HEAD:pages-build --force
          fi
          popd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
